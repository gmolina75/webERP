# webERP Security Hardening
# PHP 8.3+ required for CVE-2026-109618, CVE-2026-109619, CVE-2024-4577

# PHP Settings
expose_php = Off
display_errors = Off
log_errors = On
error_log = /var/log/php_errors.log
error_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED

# Memory Management (Fixes OOM-related CVE-2026-109618)
memory_limit = 256M
max_execution_time = 300
max_input_nesting_level = 256
max_input_vars = 5000

# Input Validation
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 20
default_charset = "UTF-8"

# Session Security
session.use_strict_mode = On
session.cookie_httponly = On
session.cookie_secure = On
session.cookie_samesite = "Strict"
session.use_cookies = On
session.use_only_cookies = On
session.cache_limiter = "private, must-revalidate"
session.cookie_path = "/"
session.cookie_domain = ""
session.name = "PHPSESSIDWEBERP"
session.gc_maxlifetime = 1800
session.gc_probability = 1
session.gc_divisor = 100
session.save_path = "/var/lib/php/sessions"

# CGI Security (Fixes CVE-2024-4577)
cgi.fix_pathinfo = 0
cgi.force_redirect = On
cgi.redirect_status_env = 1

# Request Security
request_order = "GP"
variables_order = "GPCS"
register_globals = Off
magic_quotes_gpc = Off
magic_quotes_runtime = Off
magic_quotes_sybase = Off

# Security Extensions
enable_dl = Off
allow_url_fopen = Off
allow_url_include = Off
display_stack_errors = Off
html_errors = Off
docref_root = ""
docref_ext = ""
auto_prepend_file = ""
auto_append_file = ""

# Open_basedir (Restrict file access)
open_basedir = "/var/www/html/webERP:/tmp:/var/lib/php/sessions"

# File Security
file_uploads = On
upload_max_filesize = 64M
upload_tmp_dir = "/tmp"

# Additional Hardening
suhosin.simulation = On
suhosin.max_input_vars = 10000
suhosin.max_array_index_depth = 256
suhosin.max_list_nest_level = 256

# Error Handling
log_errors_max_len = 1024
log_errors = On
ignore_repeated_errors = On
ignore_repeated_source = Off

# Database Security
pdo_emulate_prepared_statements = On